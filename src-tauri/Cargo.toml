[package]
name = "putz"
version = "0.5.1"
default-run = "putz"
description = "A local developer terminal with a Canvas tab and a Git Graph tab"
authors = ["vbomfim"]
license = "MIT"
edition = "2021"

[lib]
name = "putz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
directories = "6"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "process"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
boa_engine = "0.20"
dirs = "6"
url = "2"
walkdir = "2.5.0"
tauri-plugin-dialog = "2.7.0"
reqwest = { version = "0.13.2", features = ["stream", "json"] }
urlencoding = "2.1.3"
futures-util = "0.3.32"
tokio-util = "0.7"
getrandom = "0.3"
# T1 (#140): cross-platform local IPC (Unix socket / Windows named pipe).
# `tokio` feature enables the async LocalSocketListener API used by swarm::socket.
interprocess = { version = "2", features = ["tokio"] }
thiserror = "1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-process = "2"

[target."cfg(windows)".dependencies]
winreg = "0.55"
# T1 fixup #2 (issue #149): explicit DACL on the Windows named pipe so
# only the current user's SID has access (not the default-DACL inherited
# behavior, which can be surprisingly permissive on systems with custom
# tokens). `widestring` is used to build the SDDL wide string accepted
# by `interprocess::os::windows::security_descriptor::SecurityDescriptor::deserialize`.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
widestring = "1"

[[bin]]
name = "measure_spawn"
path = "src/bin/measure_spawn.rs"
# Gated behind a feature flag so `tauri build` (which doesn't enable
# the feature) doesn't try to bundle this dev tool. Run with:
#   cargo run --features measure_spawn --bin measure_spawn
required-features = ["measure_spawn"]

[features]
default = []
# Dev-only feature for the measure_spawn binary. Excluded from `tauri build`.
measure_spawn = []

[dev-dependencies]
tempfile = "3"
# Enables `tauri::test::mock_app()` for swarm coordinator lifecycle tests
# (T1 fixup #2 — restart_does_not_unlink_new_socket regression test).
tauri = { version = "2", features = ["test"] }
serial_test = "3"
# `test-util` enables `tokio::time::pause()` / `advance()` for
# deterministic time control in flaky-prone debounce tests
# (T3 PR #155 fixup — CR-Opus pass-2 #12).
tokio = { version = "1", features = ["test-util"] }

