[package]
name = "putz"
version = "0.4.0"
default-run = "putz"
description = "A local developer terminal with a Canvas tab and a Git Graph tab"
authors = ["vbomfim"]
license = "MIT"
edition = "2021"

[lib]
name = "putz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
directories = "6"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "process"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
boa_engine = "0.20"
dirs = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
url = "2"
walkdir = "2.5.0"
tauri-plugin-dialog = "2.7.0"
reqwest = { version = "0.13.2", features = ["stream", "json"] }
urlencoding = "2.1.3"
futures-util = "0.3.32"
tokio-util = "0.7"
getrandom = "0.3"
# T1 (#140): cross-platform local IPC (Unix socket / Windows named pipe).
# `tokio` feature enables the async LocalSocketListener API used by swarm::socket.
interprocess = { version = "2", features = ["tokio"] }
thiserror = "1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-process = "2"

[target."cfg(windows)".dependencies]
winreg = "0.55"

[[bin]]
name = "measure_spawn"
path = "src/bin/measure_spawn.rs"

[dev-dependencies]
tempfile = "3"

